databases:
  - name: quesiq-interview-db
    plan: free

services:
  - type: web
    name: quesiq-interview-rebuild
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quesiq-interview-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
