databases:
  - name: quesiq-interview-db
    plan: free

services:
  - type: web
    name: quesiq-interview-rebuild
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm start
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quesiq-interview-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
  - type: cron
    name: quesiq-monthly-pricing-review
    runtime: node
    plan: starter
    schedule: "0 15 1 * *"
    buildCommand: npm ci
    startCommand: node scripts/run-pricing-review.mjs
    envVars:
      - key: QUESIQ_APP_URL
        value: https://quesiq.com
      - key: PRICING_CHECK_SECRET
        sync: false
